name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Functional contracts
        run: npm test
      - name: Design contract
        run: npm run check:design
      - name: JavaScript syntax
        shell: bash
        run: |
          for path in dist/*.js scripts/*.mjs; do
            node --check "$path"
          done
      - name: Package reviewed source
        run: python3 scripts/package-source.py
      - name: Verify archive integrity and generated documents
        run: node scripts/check-package.mjs
